apply plugin: 'java'
apply plugin: 'eclipse'
compileJava.options.encoding = 'UTF-8'

defaultTasks('zip')

sourceCompatibility = JavaVersion.VERSION_21

sourceSets {
	mainSource {
		java {
			srcDir('dist/game/data/scripts')
		}
	}
}

repositories {
    mavenCentral()
}

configurations.all {
    transitive = false
}

dependencies {
	implementation 'org.slf4j:slf4j-api:1.7.23'
	implementation files('../L2J_Server/dist/libs/mmocore.jar')
	implementation project(':L2J_Server')
	testImplementation 'org.testng:testng:6.10'
	testImplementation 'com.beust:jcommander:1.48'
	testImplementation 'org.mockito:mockito-core:2.7.9'
	testImplementation 'net.bytebuddy:byte-buddy:1.6.8'
	testImplementation 'net.bytebuddy:byte-buddy-agent:1.6.8'
	testImplementation 'org.objenesis:objenesis:2.5.1'
	testImplementation 'org.jmockit:jmockit:1.30'
}

task zip(type: Zip) {
	archiveBaseName = 'L2J_DataPack'
	from('dist')
	println 'Build in build/distributions/' + archiveBaseName.get() + '.zip'
}

build.finalizedBy(zip)

eclipse {
	project {
		name = 'L2J_DataPack'
		comment 'L2J Server Project'
		natures 'org.eclipse.buildship.core.gradleprojectbuilde'
	}
}